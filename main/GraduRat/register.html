<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gradurat | Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #05070d;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .brand {
            display: flex;
            align-items: center;

            text-decoration: none;
        }

        .brand img {
            width: 48px;
            height: 48px;

            object-fit: contain;
        }

        .home-link {
            color: #aab3c5;

            text-decoration: none;

            font-size: 14px;

            transition: 0.3s;
        }

        .home-link:hover {
            color: #258cff;
        }


        /* =========================
           MAIN
        ========================= */

        .register-container {

            min-height: calc(100vh - 80px);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 60px 20px;

            position: relative;

            overflow: hidden;
        }

        .register-container::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            background: #0066ff;

            opacity: 0.08;

            filter: blur(140px);

            border-radius: 50%;

            top: 10%;
            left: 50%;

            transform: translateX(-50%);
        }


        /* =========================
           REGISTER BOX
        ========================= */

        .register-box {

            width: 100%;

            max-width: 650px;

            background: rgba(12,16,27,0.96);

            border: 1px solid rgba(37,140,255,0.25);

            border-radius: 20px;

            padding: 45px;

            position: relative;

            z-index: 1;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.45);
        }


        /* =========================
           HEADING
        ========================= */

        .heading {

            text-align: center;

            margin-bottom: 35px;
        }

        .heading h1 {

            font-size: 32px;

            margin-bottom: 12px;
        }

        .heading p {

            color: #8d98ad;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================
           MESSAGES
        ========================= */

        #message {

            display: none;

            padding: 13px 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 13px;

            line-height: 1.5;
        }

        #message.error {

            display: block;

            background: rgba(255,70,70,0.1);

            border: 1px solid rgba(255,70,70,0.3);

            color: #ff8d8d;
        }

        #message.success {

            display: block;

            background: rgba(50,200,120,0.1);

            border: 1px solid rgba(50,200,120,0.3);

            color: #79e6a7;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;
        }

        .form-group input,
        .form-group select {

            width: 100%;

            padding: 14px 16px;

            background: #080c15;

            border: 1px solid #263044;

            border-radius: 10px;

            color: white;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {

            border-color: #258cff;

            box-shadow:
                0 0 0 3px rgba(37,140,255,0.08);
        }

        .form-group input::placeholder {

            color: #596377;
        }

        select option {

            background: #080c15;

            color: white;
        }


        /* =========================
           TWO COLUMN
        ========================= */

        .two-column {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        /* =========================
           ROLE SELECTION
        ========================= */

        .role-title {

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 12px;
        }

        .roles {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 25px;
        }

        .role {

            position: relative;
        }

        .role input {

            position: absolute;

            opacity: 0;
        }

        .role label {

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            min-height: 75px;

            padding: 10px;

            border: 1px solid #263044;

            border-radius: 10px;

            background: #080c15;

            color: #aab3c5;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .role label:hover {

            border-color: #258cff;

            color: white;
        }

        .role input:checked + label {

            border-color: #258cff;

            background: rgba(37,140,255,0.12);

            color: white;

            box-shadow:
                0 0 20px rgba(37,140,255,0.08);
        }


        /* =========================
           ROLE INFORMATION
        ========================= */

        .role-section {

            display: none;

            margin-top: 10px;
        }

        .role-section.active {

            display: block;
        }

        .section-heading {

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 18px;

            color: #ffffff;
        }


        /* =========================
           BUTTON
        ========================= */

        .register-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #258cff;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 10px;
        }

        .register-btn:hover {

            background: #1478e8;

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(37,140,255,0.2);
        }

        .register-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-text {

            text-align: center;

            margin-top: 25px;

            color: #7f899d;

            font-size: 13px;
        }

        .login-text a {

            color: #258cff;

            text-decoration: none;

            font-weight: 600;
        }

        .login-text a:hover {

            text-decoration: underline;
        }

        .admin-login {

            text-align: center;

            margin-top: 15px;
        }

        .admin-login a {

            color: #7f899d;

            font-size: 12px;

            text-decoration: none;
        }

        .admin-login a:hover {

            color: #258cff;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {

                padding: 0 5%;
            }

            .register-box {

                padding: 30px 22px;
            }

            .heading h1 {

                font-size: 26px;
            }

            .roles {

                grid-template-columns: 1fr;
            }

            .two-column {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a href="index.html" class="brand">

            <img
                src="logo1.jpg"
                alt="Gradurat Logo"
            >

        </a>


        <a
            href="index.html"
            class="home-link"
        >
            Back to Home
        </a>

    </nav>



    <!-- =========================
         REGISTRATION
    ========================= -->

    <main class="register-container">

        <div class="register-box">


            <!-- HEADING -->

            <div class="heading">

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Start your Gradurat journey and discover
                    where your skills can take you.
                </p>

            </div>


            <!-- MESSAGE -->

            <div id="message"></div>



            <!-- =========================
                 FORM
            ========================= -->

            <form id="registrationForm">


                <!-- =====================
                     BASIC INFORMATION
                ====================== -->

                <div class="two-column">

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required
                        >

                    </div>

                </div>



                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>



                <div class="two-column">

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                    </div>

                </div>



                <!-- =========================
                     ROLE
                ========================== -->

                <div class="role-title">

                    I am registering as:

                </div>


                <div class="roles">


                    <!-- STUDENT -->

                    <div class="role">

                        <input
                            type="radio"
                            id="student"
                            name="role"
                            value="student"
                            required
                        >

                        <label for="student">

                            🎓 Student

                        </label>

                    </div>



                    <!-- GRADUATE -->

                    <div class="role">

                        <input
                            type="radio"
                            id="graduate"
                            name="role"
                            value="graduate"
                        >

                        <label for="graduate">

                            💼 Graduate

                        </label>

                    </div>



                    <!-- EMPLOYER -->

                    <div class="role">

                        <input
                            type="radio"
                            id="employer"
                            name="role"
                            value="employer"
                        >

                        <label for="employer">

                            🏢 Employer

                        </label>

                    </div>



                    <!-- LECTURER -->

                    <div class="role">

                        <input
                            type="radio"
                            id="lecturer"
                            name="role"
                            value="lecturer"
                        >

                        <label for="lecturer">

                            👩‍🏫 Lecturer

                        </label>

                    </div>

                </div>



                <!-- =========================
                     STUDENT / GRADUATE
                ========================== -->

                <section
                    id="studentSection"
                    class="role-section"
                >

                    <div class="section-heading">

                        Education Information

                    </div>


                    <div class="two-column">


                        <div class="form-group">

                            <label for="qualification">
                                Qualification
                            </label>

                            <input
                                type="text"
                                id="qualification"
                                placeholder="e.g. Bachelor of IT"
                            >

                        </div>



                        <div class="form-group">

                            <label for="institution">
                                Institution
                            </label>

                            <input
                                type="text"
                                id="institution"
                                placeholder="e.g. Richfield"
                            >

                        </div>


                    </div>



                    <div class="two-column">


                        <div class="form-group">

                            <label for="field">
                                Field of Study
                            </label>

                            <input
                                type="text"
                                id="field"
                                placeholder="e.g. Information Technology"
                            >

                        </div>



                        <div class="form-group">

                            <label for="graduationYear">
                                Graduation Year
                            </label>

                            <input
                                type="number"
                                id="graduationYear"
                                placeholder="e.g. 2029"
                                min="1900"
                                max="2100"
                            >

                        </div>


                    </div>

                </section>



                <!-- =========================
                     EMPLOYER
                ========================== -->

                <section
                    id="employerSection"
                    class="role-section"
                >

                    <div class="section-heading">

                        Company Information

                    </div>


                    <div class="form-group">

                        <label for="companyName">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            placeholder="e.g. Gradurat Technologies"
                        >

                    </div>



                    <div class="two-column">


                        <div class="form-group">

                            <label for="industry">
                                Industry
                            </label>

                            <input
                                type="text"
                                id="industry"
                                placeholder="e.g. Technology"
                            >

                        </div>



                        <div class="form-group">

                            <label for="companyLocation">
                                Location
                            </label>

                            <input
                                type="text"
                                id="companyLocation"
                                placeholder="e.g. Johannesburg"
                            >

                        </div>


                    </div>



                    <div class="form-group">

                        <label for="website">
                            Website
                        </label>

                        <input
                            type="url"
                            id="website"
                            placeholder="https://example.com"
                        >

                    </div>

                </section>



                <!-- =========================
                     LECTURER
                ========================== -->

                <section
                    id="lecturerSection"
                    class="role-section"
                >

                    <div class="section-heading">

                        Lecturer Information

                    </div>


                    <div class="two-column">


                        <div class="form-group">

                            <label for="lecturerInstitution">
                                Institution
                            </label>

                            <input
                                type="text"
                                id="lecturerInstitution"
                                placeholder="e.g. Richfield"
                            >

                        </div>



                        <div class="form-group">

                            <label for="department">
                                Department
                            </label>

                            <input
                                type="text"
                                id="department"
                                placeholder="e.g. IT"
                            >

                        </div>


                    </div>

                </section>



                <!-- =========================
                     BUTTON
                ========================== -->

                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton"
                >

                    Create Account

                </button>


            </form>



            <!-- =========================
                 LOGIN
            ========================== -->

            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Sign in
                </a>

            </div>



            <!-- ADMIN -->

            <div class="admin-login">

                <a href="admin-login.html">

                    Administrator Login →

                </a>

            </div>


        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const form =
            document.getElementById(
                "registrationForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const button =
            document.getElementById(
                "registerButton"
            );


        const studentSection =
            document.getElementById(
                "studentSection"
            );

        const employerSection =
            document.getElementById(
                "employerSection"
            );

        const lecturerSection =
            document.getElementById(
                "lecturerSection"
            );


        /*
         * =========================
         * MESSAGE
         * =========================
         */

        function showMessage(text, type) {

            message.textContent = text;

            message.className = type;

        }


        /*
         * =========================
         * GET ROLE
         * =========================
         */

        function getRole() {

            const selected =
                document.querySelector(
                    'input[name="role"]:checked'
                );

            return selected
                ? selected.value
                : null;
        }


        /*
         * =========================
         * UPDATE ROLE
         * =========================
         */

        function updateRoleFields() {

            const role = getRole();


            studentSection.classList.remove(
                "active"
            );

            employerSection.classList.remove(
                "active"
            );

            lecturerSection.classList.remove(
                "active"
            );


            if (
                role === "student" ||
                role === "graduate"
            ) {

                studentSection.classList.add(
                    "active"
                );

            }


            if (role === "employer") {

                employerSection.classList.add(
                    "active"
                );

            }


            if (role === "lecturer") {

                lecturerSection.classList.add(
                    "active"
                );

            }

        }


        /*
         * =========================
         * ROLE LISTENERS
         * =========================
         */

        document
            .querySelectorAll(
                'input[name="role"]'
            )
            .forEach(input => {

                input.addEventListener(
                    "change",
                    updateRoleFields
                );

            });



        /*
         * =========================
         * FORM SUBMIT
         * =========================
         */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const role = getRole();


                if (!role) {

                    showMessage(
                        "Please select your role.",
                        "error"
                    );

                    return;

                }


                const firstName =
                    document
                        .getElementById(
                            "firstName"
                        )
                        .value
                        .trim();


                const lastName =
                    document
                        .getElementById(
                            "lastName"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;



                /*
                 * PASSWORD CHECK
                 */

                if (password.length < 8) {

                    showMessage(
                        "Password must be at least 8 characters.",
                        "error"
                    );

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }



                /*
                 * DISABLE BUTTON
                 */

                button.disabled = true;

                button.textContent =
                    "Creating Account...";



                try {


                    /*
                     * =========================
                     * STUDENT / GRADUATE
                     * =========================
                     */

                    if (
                        role === "student" ||
                        role === "graduate"
                    ) {


                        const qualification =
                            document
                                .getElementById(
                                    "qualification"
                                )
                                .value
                                .trim();


                        const institution =
                            document
                                .getElementById(
                                    "institution"
                                )
                                .value
                                .trim();


                        const field =
                            document
                                .getElementById(
                                    "field"
                                )
                                .value
                                .trim();


                        if (
                            !qualification ||
                            !institution ||
                            !field
                        ) {

                            throw new Error(
                                "Please complete your qualification, institution and field of study."
                            );

                        }


                        const graduationYear =
                            document
                                .getElementById(
                                    "graduationYear"
                                )
                                .value;


                        const payload = {

                            firstName:
                                firstName,

                            lastName:
                                lastName,

                            email:
                                email,

                            qualification:
                                qualification,

                            institution:
                                institution,

                            field:
                                field,

                            graduationYear:
                                graduationYear
                                    ? Number(
                                        graduationYear
                                    )
                                    : null

                        };


                        const response =
                            await fetch(
                                "/api/students",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            payload
                                        )

                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Could not create student account."
                            );

                        }



                        /*
                         * SAVE USER
                         */

                        const user = {

                            id:
                                result.student.id,

                            fullName:
                                `${firstName} ${lastName}`,

                            email:
                                email,

                            role:
                                role

                        };


                        localStorage.setItem(
                            "graduratUser",
                            JSON.stringify(user)
                        );


                        localStorage.setItem(
                            "graduRatStudentId",
                            result.student.id
                        );



                        showMessage(
                            "Account created successfully! Taking you to your profile...",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "profile.html";

                            },
                            700
                        );


                        return;

                    }



                    /*
                     * =========================
                     * EMPLOYER
                     * =========================
                     */

                    if (role === "employer") {


                        const companyName =
                            document
                                .getElementById(
                                    "companyName"
                                )
                                .value
                                .trim();


                        const industry =
                            document
                                .getElementById(
                                    "industry"
                                )
                                .value
                                .trim();


                        const companyLocation =
                            document
                                .getElementById(
                                    "companyLocation"
                                )
                                .value
                                .trim();


                        const website =
                            document
                                .getElementById(
                                    "website"
                                )
                                .value
                                .trim();


                        if (
                            !companyName ||
                            !industry
                        ) {

                            throw new Error(
                                "Please enter your company name and industry."
                            );

                        }


                        const payload = {

                            companyName:
                                companyName,

                            email:
                                email,

                            industry:
                                industry,

                            location:
                                companyLocation,

                            website:
                                website,

                            contactPersonName:
                                `${firstName} ${lastName}`,

                            contactEmail:
                                email

                        };


                        const response =
                            await fetch(
                                "/api/employers",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            payload
                                        )

                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Could not create employer account."
                            );

                        }



                        /*
                         * SAVE USER
                         */

                        const user = {

                            id:
                                result.employer.id,

                            fullName:
                                `${firstName} ${lastName}`,

                            email:
                                email,

                            role:
                                "employer",

                            companyName:
                                companyName

                        };


                        localStorage.setItem(
                            "graduratUser",
                            JSON.stringify(user)
                        );


                        localStorage.setItem(
                            "graduRatEmployerId",
                            result.employer.id
                        );



                        showMessage(
                            "Account created successfully! Taking you to your profile...",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "profile.html";

                            },
                            700
                        );


                        return;

                    }



                    /*
                     * =========================
                     * LECTURER
                     * =========================
                     */

                    if (role === "lecturer") {


                        const institution =
                            document
                                .getElementById(
                                    "lecturerInstitution"
                                )
                                .value
                                .trim();


                        const department =
                            document
                                .getElementById(
                                    "department"
                                )
                                .value
                                .trim();


                        if (
                            !institution ||
                            !department
                        ) {

                            throw new Error(
                                "Please enter your institution and department."
                            );

                        }


                        /*
                         * Lecturer API is not
                         * created yet.
                         *
                         * Save temporary account
                         * information locally.
                         */

                        const user = {

                            fullName:
                                `${firstName} ${lastName}`,

                            email:
                                email,

                            role:
                                "lecturer",

                            institution:
                                institution,

                            department:
                                department

                        };


                        localStorage.setItem(
                            "graduratUser",
                            JSON.stringify(user)
                        );


                        showMessage(
                            "Account information saved! Taking you to your profile...",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "profile.html";

                            },
                            700
                        );


                        return;

                    }

                }


                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Something went wrong. Please try again.",
                        "error"
                    );

                }


                finally {

                    button.disabled = false;

                    button.textContent =
                        "Create Account";

                }

            }
        );


        /*
         * START WITH NO EXTRA
         * ROLE SECTION SHOWING
         */

        updateRoleFields();

    </script>

</body>

</html>
