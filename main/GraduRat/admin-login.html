<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login | Gradurat</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      :root {
        --card: rgba(15, 23, 42, 0.95);
        --input: #020617;
        --border: rgba(255, 255, 255, 0.08);
        --input-border: #334155;
        --text: #ffffff;
        --secondary-text: #cbd5e1;
        --muted-text: #94a3b8;
        --blue: #3b82f6;
        --blue-tint: #60a5fa;
        --blue-btn: #2563eb;
        --blue-btn-hover: #1d4ed8;
        --blue-light: rgba(59, 130, 246, 0.15);
        --blue-border: rgba(59, 130, 246, 0.4);
        --danger-bg: rgba(239, 68, 68, 0.12);
        --danger-border: rgba(239, 68, 68, 0.3);
        --danger-text: #fca5a5;
        --success-bg: rgba(34, 197, 94, 0.12);
        --success-border: rgba(34, 197, 94, 0.3);
        --success-text: #86efac;
        --note-bg: rgba(30, 41, 59, 0.7);
        --note-border: rgba(148, 163, 184, 0.12);
      }

      body.light-theme {
        --card: #ffffff;
        --input: #f8fafc;
        --border: #dce3ee;
        --input-border: #c8d2e2;
        --text: #111827;
        --secondary-text: #5c677a;
        --muted-text: #697586;
        --blue: #1266e3;
        --blue-tint: #1266e3;
        --blue-btn: #1266e3;
        --blue-btn-hover: #0958c9;
        --blue-light: #eaf2ff;
        --blue-border: #b9d3ff;
        --danger-bg: #fdeceb;
        --danger-border: #f3b8b3;
        --danger-text: #b42318;
        --success-bg: #e9f9ef;
        --success-border: #a9e3bf;
        --success-text: #0f7a3d;
        --note-bg: #f0f4f9;
        --note-border: #dce3ee;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #020617, #06142f, #0b1f3a);
        color: var(--text);
        display: flex;
        flex-direction: column;
        transition: color 0.25s ease;
      }

      body.light-theme {
        background: linear-gradient(135deg, #f4f7fb, #e9eef7, #dce6f5);
      }

      /* ================= NAVBAR ================= */

      header {
        width: 100%;
        padding: 20px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
        color: var(--text);
        text-decoration: none;
      }

      .logo span {
        color: var(--blue);
      }

      .back-home {
        color: var(--secondary-text);
        text-decoration: none;
        font-size: 14px;
        transition: 0.3s;
      }

      .back-home:hover {
        color: var(--blue-tint);
      }

      /* ================= MAIN ================= */

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
      }

      .login-container {
        width: 100%;
        max-width: 450px;
      }

      .admin-badge {
        text-align: center;
        margin-bottom: 25px;
      }

      .admin-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: var(--blue-light);
        border: 1px solid var(--blue-border);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
      }

      .admin-badge h1 {
        font-size: 30px;
        margin-bottom: 8px;
      }

      .admin-badge p {
        color: var(--muted-text);
        font-size: 14px;
      }

      /* ================= LOGIN CARD ================= */

      .login-card {
        background: var(--card);
        border: 1px solid var(--blue-border);
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      .form-group {
        margin-bottom: 22px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--secondary-text);
      }

      .form-group input {
        width: 100%;
        padding: 14px 15px;
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 10px;
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }

      .form-group input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      }

      .password-wrapper {
        position: relative;
      }

      .password-wrapper input {
        padding-right: 75px;
      }

      .show-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--blue-tint);
        cursor: pointer;
        font-size: 12px;
      }

      /* ================= LOGIN BUTTON ================= */

      .login-btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: var(--blue-btn);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-btn:hover {
        background: var(--blue-btn-hover);
        transform: translateY(-1px);
      }

      /* ================= MESSAGE ================= */

      .message {
        display: none;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
      }

      .error {
        display: block;
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger-text);
      }

      .success {
        display: block;
        background: var(--success-bg);
        border: 1px solid var(--success-border);
        color: var(--success-text);
      }

      /* ================= SECURITY NOTE ================= */

      .security-note {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        background: var(--note-bg);
        border: 1px solid var(--note-border);
        color: var(--muted-text);
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
      }

      /* ================= FOOTER ================= */

      footer {
        text-align: center;
        padding: 20px;
        color: var(--muted-text);
        font-size: 12px;
      }

      /* ================= MOBILE ================= */

      @media (max-width: 600px) {
        header {
          padding: 18px 5%;
        }

        .logo {
          font-size: 24px;
        }

        main {
          padding: 30px 15px;
        }

        .login-card {
          padding: 25px 20px;
        }

        .admin-badge h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <script src="theme.js"></script>
    <!-- ================= NAVBAR ================= -->

    <header>
      <a href="index.html" class="logo"> Gradu<span>Rat</span> </a>

      <a href="index.html" class="back-home"> ← Back to Home </a>
    </header>

    <!-- ================= MAIN ================= -->

    <main>
      <div class="login-container">
        <!-- Admin Heading -->

        <div class="admin-badge">
          <div class="admin-icon">🛡️</div>

          <h1>Admin Login</h1>

          <p>Access the Gradurat administration portal</p>
        </div>

        <!-- Login Card -->

        <div class="login-card">
          <div id="message" class="message"></div>

          <form id="adminLoginForm">
            <!-- Email -->

            <div class="form-group">
              <label for="email"> Admin Email </label>

              <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
              />
            </div>

            <!-- Password -->

            <div class="form-group">
              <label for="password"> Password </label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter password"
                  required
                />

                <button
                  type="button"
                  class="show-password"
                  onclick="togglePassword()"
                >
                  Show
                </button>
              </div>
            </div>

            <!-- Login Button -->

            <button type="submit" class="login-btn">
              Login to Admin Portal
            </button>
          </form>

          <!-- Security Information -->

          <div class="security-note">
            🛡️ <strong>Admin Access</strong><br />

            This area is restricted to authorised Gradurat administrators only.
          </div>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER ================= -->

    <footer>© 2026 Gradurat. Admin Portal.</footer>

    <!-- ================= JAVASCRIPT ================= -->

        <script>
      const adminLoginForm = document.getElementById("adminLoginForm");

      const message = document.getElementById("message");

      function togglePassword() {
        const password = document.getElementById("password");
        const button = document.querySelector(".show-password");
        if (password.type === "password") {
          password.type = "text";
          button.textContent = "Hide";
        } else {
          password.type = "password";
          button.textContent = "Show";
        }
      }

      adminLoginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.className = "message";
        message.textContent = "";

        try {
          const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || "Login failed.");
          }

          message.textContent = "Login successful! Redirecting...";
          message.classList.add("success");

          localStorage.setItem("graduratAdminLoggedIn", "true");
          localStorage.setItem(
            "graduratAdmin",
            JSON.stringify({
              email: result.email,
              role: "admin",
              token: result.token,
            }),
          );

          setTimeout(function () {
            window.location.href = "admin-dashboard.html";
          }, 800);
        } catch (error) {
          message.textContent = error.message;
          message.classList.add("error");
        }
      });
    </script>  
  </body>
</html>
